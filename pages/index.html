<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HTMX Stuff -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <!-- Misc -->
  <script type="module" src="https://md-block.verou.me/md-block.js"></script>

  <link href="styles/prism.css" rel="stylesheet">
  <script src="scripts/prism.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/global.css">

  <title>Kes Klitsie Burrows Illustration</title>

  <style>
    body {
      background-color: var(--bg);
    }

    #frame {
      display: flex;
      flex-direction: column;
      /*background-color: var(--bg);*/
      z-index: 2;
      align-content: center;
      justify-content: space-between;
      /* width: 80vw; */
      /* min-height: 100vh; */
      position: relative;
    }

    #background {
      position: fixed;
      inset: 0;
      z-index: 0;
      /* Put whatever you want here — img, video, canvas, etc. */
      width: 100%;
      height: 100%;
      mix-blend-mode: darken;
    }

    #background img {
      object-position: bottom;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #route-content {
      display: flex;
      /* Prevents it from affecting the height of #frame */
      flex-grow: 1;
      /* Keeps content scrollable if it overflows */
      overflow-y: auto;
      height: 100%;
      overflow-x: hidden;
    }

    nav-router button {
      background-color: var(--primary-orange);
      filter: saturate(500%);
    }
  </style>
</head>

<body>
  <script>
    document.body.addEventListener('htmx:beforeRequest', (event) => {
      const children = document.querySelector('#components-cache').children;
      const set = new Set();

      for (const el of children) {
        if (el instanceof HTMLScriptElement) {
          continue;
        }
        const cleanName = el.id.replace(/-template$/, '');
        if (cleanName.trim().length > 0) {
          set.add(cleanName);
        }
      }

      event.detail.xhr.setRequestHeader(
        'x-hydrated',
        JSON.stringify([...set]),
      );
    });
  </script>

  <div id="background">
    <img src="imgs/sitebgPNG.png" alt="background">
  </div>

  <div id="frame">
    <div style="display: flex; flex-direction: column; margin: 1rem; gap: 1rem">
      <img src="imgs/KesKlitsieBurrows.png" alt="Kes Klitsie Burrows"
        style="max-height: 25vh; max-width: 100%; object-fit: contain">
    </div>

    <div id="img-modal">
      <img id="img-modal-content" src="" alt="">
    </div>
    <div style="display: flex; flex-direction: column; flex-grow: 1">
      <nav-router routes="Home, Info, Editorial, PictureBook, Sketch, Portraits" target="#route-content">
      </nav-router>

      <div id="route-content" hx-history-elt>{|.route_content|}</div>
    </div>
    <footer style="margin-top: 1rem">
      <img src="imgs/palettePNG.png" alt="palette" style="max-height: 25vh; max-width: 100%; object-fit: contain">
    </footer>
  </div>
</body>

</html>
